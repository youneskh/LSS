<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<rect width="1080" height="1080" fill="#102A43"/><rect x="72" y="70" width="170" height="30" rx="15" fill="#0E7C86"/>
<text x="72" y="160" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#BEE3E8">LSS - LIFE SCIENCES SUITE</text>
<text x="72" y="270" font-family="Arial, sans-serif" font-size="76" font-weight="700" fill="#FFFFFF">A batch is more</text><text x="72" y="355" font-family="Arial, sans-serif" font-size="76" font-weight="700" fill="#FFFFFF">than a production order.</text>
<text x="72" y="430" font-family="Arial, sans-serif" font-size="32" fill="#D9E2EC">It is the material, checks, decisions,</text><text x="72" y="475" font-family="Arial, sans-serif" font-size="32" fill="#D9E2EC">and people behind a product.</text>
<path d="M118 640 H964" stroke="#0E7C86" stroke-width="9"/><g font-family="Arial, sans-serif" text-anchor="middle"><g><circle cx="170" cy="640" r="27" fill="#D98E04"/><text x="170" y="710" font-size="24" font-weight="700" fill="#FFFFFF">RECEIVE</text></g><g><circle cx="370" cy="640" r="27" fill="#0E7C86"/><text x="370" y="710" font-size="24" font-weight="700" fill="#FFFFFF">ASSESS</text></g><g><circle cx="570" cy="640" r="27" fill="#0E7C86"/><text x="570" y="710" font-size="24" font-weight="700" fill="#FFFFFF">MAKE</text></g><g><circle cx="770" cy="640" r="27" fill="#0E7C86"/><text x="770" y="710" font-size="24" font-weight="700" fill="#FFFFFF">DECIDE</text></g><g><circle cx="960" cy="640" r="27" fill="#0E7C86"/><text x="960" y="710" font-size="24" font-weight="700" fill="#FFFFFF">TRACE</text></g></g>
<line x1="72" y1="840" x2="1008" y2="840" stroke="#486581"/><text x="72" y="900" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Traceability that connects operations and quality.</text><text x="72" y="1000" font-family="Arial, sans-serif" font-size="20" fill="#B0BEC5">Designed to support regulated workflows. Customer configuration and validation are required.</text>
</svg>
