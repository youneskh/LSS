<svg xmlns="http://www.w3.org/2000/svg" width="841mm" height="1189mm" viewBox="0 0 841 1189"><rect width="841" height="1189" fill="#102A43"/><text x="55" y="78" font-family="Arial" font-size="18" font-weight="700" fill="#BEE3E8">[YOUR LOGO]   LSS - LIFE SCIENCES SUITE</text><text x="55" y="190" font-family="Arial" font-size="62" font-weight="700" fill="#FFFFFF">See the complete</text><text x="55" y="262" font-family="Arial" font-size="62" font-weight="700" fill="#FFFFFF">journey of a batch.</text><text x="55" y="330" font-family="Arial" font-size="24" fill="#D9E2EC">From material receipt to quality decision, LSS is designed to connect the operational and quality context behind regulated products.</text><path d="M95 515 H745" stroke="#0E7C86" stroke-width="12"/><g font-family="Arial" text-anchor="middle"><g><circle cx="95" cy="515" r="30" fill="#D98E04"/><text x="95" y="575" font-size="17" font-weight="700" fill="#FFFFFF">RECEIVE</text><text x="95" y="605" font-size="14" fill="#BEE3E8">Material &amp; lot</text></g><g><circle cx="255" cy="515" r="30" fill="#0E7C86"/><text x="255" y="575" font-size="17" font-weight="700" fill="#FFFFFF">ASSESS</text><text x="255" y="605" font-size="14" fill="#BEE3E8">Status &amp; checks</text></g><g><circle cx="415" cy="515" r="30" fill="#0E7C86"/><text x="415" y="575" font-size="17" font-weight="700" fill="#FFFFFF">MAKE</text><text x="415" y="605" font-size="14" fill="#BEE3E8">Batch context</text></g><g><circle cx="575" cy="515" r="30" fill="#0E7C86"/><text x="575" y="575" font-size="17" font-weight="700" fill="#FFFFFF">DECIDE</text><text x="575" y="605" font-size="14" fill="#BEE3E8">Quality workflow</text></g><g><circle cx="745" cy="515" r="30" fill="#0E7C86"/><text x="745" y="575" font-size="17" font-weight="700" fill="#FFFFFF">TRACE</text><text x="745" y="605" font-size="14" fill="#BEE3E8">Linked story</text></g></g><rect x="55" y="750" width="731" height="1" fill="#486581"/><text x="55" y="835" font-family="Arial" font-size="38" font-weight="700" fill="#FFFFFF">Bring us one difficult workflow.</text><text x="55" y="885" font-family="Arial" font-size="23" fill="#D9E2EC">We will map its records, roles, decisions, and evidence.</text><rect x="55" y="950" width="210" height="150" rx="8" fill="#FFFFFF"/><text x="160" y="1018" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#102A43">ADD APPROVED</text><text x="160" y="1045" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#102A43">QR CODE</text><text x="290" y="1015" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF">REQUEST A WORKFLOW DEMO</text><text x="290" y="1050" font-family="Arial" font-size="17" fill="#BEE3E8">[website]  |  [email]  |  [phone]</text><text x="55" y="1150" font-family="Arial" font-size="12" fill="#B0BEC5">LSS is designed to support regulated workflows. Compliance depends on the organisation's processes, configuration, validation, training, and quality system.</text></svg>
