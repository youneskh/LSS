[options]
db_host = db
db_port = 5432
db_user = odoo
; db_password is not stored here: the container entrypoint passes the
; PASSWORD environment variable (.env) as --db_password.
admin_passwd = $pbkdf2-sha512$600000$B8DYu3fOGaN0LgWAsFaqlQ$9EiaaQzWTQAwJpBFIH8T.aJqWD41zewjAxWLsg04KE9DkNQMtLQg5nzJhbVJETN5NHHdF02t0DkT1Qr2pimaRw
; The former second path /mnt/found-addons held a divergent duplicate of
; ls_import_export and a non-module folder (audit F-25); it is removed.
addons_path = /mnt/extra-addons
; Set to True only when Odoo runs behind a reverse proxy that sets the
; X-Forwarded-* headers; without a proxy those headers could be forged.
proxy_mode = False
; The database manager is disabled and the server is bound to the production
; database: scheduled actions no longer run on scratch or copy databases
; (audit F-21). Scratch databases are still usable from the command line
; with -d <name>, which overrides db_name.
list_db = False
db_name = odooClaude_ls_DB
dbfilter = ^odooClaude_ls_DB$
