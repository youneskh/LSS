name: CI

# Executes the quality gates that could not be run in the authoring
# environment: lint tooling, module installation against a real Odoo 19
# instance, the test suite, coverage measurement and an upgrade test.

on:
  push:
    branches: [main, "19.0*"]
  pull_request:
    branches: [main, "19.0*"]

jobs:

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint-odoo pre-commit

      - name: flake8
        run: flake8 .

      - name: pylint-odoo
        run: pylint --rcfile=.pylintrc $(find . -name "*.py" -not -path "./.git/*")

      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Install, test and coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout module
        uses: actions/checkout@v4
        with:
          path: addons/ls_capa

      - name: Checkout Odoo 19.0
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: "19.0"
          depth: 1
          path: odoo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev wkhtmltopdf

      - name: Install Odoo requirements
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r odoo/requirements.txt
          pip install coverage

      # Gate 4 of the phase report: confirm the res.users groups field
      # name on the actual target build rather than assuming it.
      - name: Probe res.users groups field name
        run: |
          python - <<'PY'
          import re, pathlib
          src = pathlib.Path("odoo/odoo/addons/base/models/res_users.py").read_text()
          for candidate in ("group_ids", "groups_id"):
              if re.search(rf"^\s+{candidate}\s*=\s*fields\.Many2many", src, re.M):
                  print(f"res.users groups field on this build: {candidate}")
                  break
          else:
              print("WARNING: neither group_ids nor groups_id matched; review tests/common.py")
          PY

      - name: Install module and run tests
        run: |
          coverage run --source=addons/ls_capa \
            odoo/odoo-bin \
            --addons-path=odoo/addons,addons \
            -d ci_ls_capa \
            -i ls_capa \
            --test-enable \
            --stop-after-init \
            --log-level=info \
            --db_host=localhost --db_port=5432 \
            --db_user=odoo --db_password=odoo

      - name: Coverage report
        run: |
          coverage report -m
          coverage xml

      # The specification sets a 95% coverage target. The build fails
      # below that threshold rather than reporting an unverified figure.
      - name: Enforce coverage threshold
        run: coverage report --fail-under=95

      - name: Upload coverage artefact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  upgrade:
    name: Upgrade test
    runs-on: ubuntu-latest
    needs: test

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          path: addons/ls_capa

      - uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: "19.0"
          depth: 1
          path: odoo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev wkhtmltopdf

      - name: Install Odoo requirements
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r odoo/requirements.txt

      - name: Fresh install with demo data
        run: |
          odoo/odoo-bin --addons-path=odoo/addons,addons \
            -d upgrade_ls_capa -i ls_capa --stop-after-init \
            --db_host=localhost --db_port=5432 \
            --db_user=odoo --db_password=odoo

      # Re-running -u on an installed module exercises the upgrade path
      # and proves the noupdate flags do not corrupt existing records.
      - name: Upgrade in place
        run: |
          odoo/odoo-bin --addons-path=odoo/addons,addons \
            -d upgrade_ls_capa -u ls_capa --stop-after-init \
            --db_host=localhost --db_port=5432 \
            --db_user=odoo --db_password=odoo

      - name: Upgrade a second time to confirm idempotence
        run: |
          odoo/odoo-bin --addons-path=odoo/addons,addons \
            -d upgrade_ls_capa -u ls_capa --stop-after-init \
            --db_host=localhost --db_port=5432 \
            --db_user=odoo --db_password=odoo
